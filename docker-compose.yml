version: '3'

services:
  app:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    depends_on:
      checkstatus:
        condition: service_completed_successfully
  postgres:
    image: postgres:11.5-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data:cached
  checkstatus:
    build:
      context: ./src
      dockerfile: Production-Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres